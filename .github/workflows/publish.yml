name: publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC に必須
    steps:
      - uses: actions/checkout@v4
      # registry-url を指定すると setup-node が .npmrc にダミーの
      # NODE_AUTH_TOKEN を書き込み、それが OIDC より優先されて 404 になる。
      # Trusted Publishing では registry-url を付けないこと
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing（OIDC 認証）は npm 11.5.1 以降が必要
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
